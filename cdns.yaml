# yaml-language-server: $schema=schemas/cdns.schema.json
- name: Cloudflare
  headers:
    - 'CF-Cache-Status'
    - 'CF-RAY'
    - 'Server: cloudflare'
    - 'CF-Connecting-IP'
    - 'CF-Request-ID'
    - 'CF-WORKER'
  ranges:
    - range_type: 'ipv4'
      url: 'https://www.cloudflare.com/ips-v4/'
    - range_type: 'ipv6'
      url: 'https://www.cloudflare.com/ips-v6/'
- name: Akamai
  headers:
    - 'X-Akamai-Request-ID'
    - 'X-Akamai-Transformed'
    - 'X-Akamai-SSL'
    - 'X-Akamai-Edge-Cache'
    - 'Server: AkamaiGHost'
    - 'X-Akamai-Staging'
    - 'Edge-Control'
    - 'X-True-Cache-Key'
    - 'X-Akamai-Device-Characteristics'
- name: Amazon CloudFront
  headers:
    - 'X-Amz-Cf-Id'
    - 'X-Cache: Hit from cloudfront'
    - 'Server: CloudFront'
    - 'X-Amz-Cf-Pop'
    - 'Via: CloudFront'
    - 'X-Amz-Acl'
    - 'X-Amz-Cf-Request-Id'
  ranges:
    - range_type: 'ipv4'
      url: 'https://d7uri8nf7uskq.cloudfront.net/tools/list-cloudfront-ips'
- name: Amazon AWS
  ranges:
    - range_type: 'combined'
      url: 'https://ip-ranges.amazonaws.com/ip-ranges.json'
- name: Fastly
  headers:
    - 'Server: Varnish'
    - 'X-Varnish'
    - 'X-Fastly-Request-ID'
    - 'X-Timer'
    - 'X-Served-By'
  ranges:
    - range_type: 'combined'
      url: 'https://api.fastly.com/public-ip-list'
- name: StackPath
  headers:
    - 'Server: StackPath'
    - 'X-Powered-By: StackPath'
    - 'X-StackPath-Request-ID'
    - 'X-SP-Edge-Cache'
    - 'X-CDN: StackPath'
- name: KeyCDN
  headers:
    - 'Server: KeyCDN'
    - 'X-CDN: KeyCDN'
    - 'X-Edge-Location' # also an identifier of Google Cloud CDN
- name: BunnyCDN
  headers:
    - 'Server: BunnyCDN'
    - 'Bunny-Cache'
    - 'Bunny-Region'
    - 'Bunny-Storage-Zone'
  ranges:
    - range_type: 'ipv4'
      url: 'https://api.bunny.net/mc/nodes/plain'
- name: Sucuri
  headers:
    - 'Server: Sucuri/Cloudproxy'
    - 'Server: Sucuri'
    - 'X-Sucuri-ID'
    - 'X-Sucuri-Cache'
    - 'X-Sucuri-Block'
    - 'X-Sucuri-Cloudproxy-Cache'
  ranges: # https://docs.sucuri.net/website-firewall/sucuri-firewall-troubleshooting-guide/ (parser exists, but website 503s)
    - range_type: 'ipv4'
      ranges:
        - 192.88.134.0/23
        - 185.93.228.0/22
        - 66.248.200.0/22
        - 208.109.0.0/22
      last_updated: 2026-06-05
    - range_type: 'ipv6'
      ranges:
        - 2a02:fe80::/29
      last_updated: 2026-06-05
- name: Imperva # Incapsula
  headers:
    - 'Server: Imperva'
    - 'X-CDN: Incapsula'
    - 'X-Info'
    - 'X-CDN-Request-ID'
    - 'X-Cdn-Provider: Incapsula'
  ranges:
    - range_type: 'combined'
      url: 'https://my.imperva.com/api/integration/v1/ips'
- name: CacheFly
  headers:
    - 'Server: CacheFly'
  ranges:
    - range_type: 'combined'
      url: 'https://cachefly.cachefly.net/ips/cdn.txt'
- name: QUIC.cloud
  headers:
    - 'Server: LiteSpeed'
    - 'X-QC-Cache'
  ranges:
    - range_type: 'combined'
      url: 'https://quic.cloud/ips'
- name: ArvanCloud
  headers:
    - 'Server: ArvanCloud'
    - 'AR-PoweredBy'
- name: G-Core Labs
  headers:
    - 'Server: GCL'
    - 'Server: G-Core Labs'
    - 'X-GCL-Cache'
    - 'X-GCL-Pop'
    - 'X-GCL-Request-ID'
    - 'X-GCL-Region'
    - 'X-GCL-Server'
    - 'X-GCL-Status'
    - 'X-GCL-Storage-Zone'
    - 'X-GCL-User'
    - 'X-GCL-User-Request-ID'
    - 'X-GCL-User-Status'
- name: Microsoft Azure CDN
  headers:
    - 'X-Azure-Ref'
    - 'Server: Azure Front Door'
    - 'X-Ms-Cdn-Ref'
    - 'X-Ms-Cdn-Request-Id'
  ranges:
    - range_type: combined
      url: 'https://www.microsoft.com/en-us/download/details.aspx?id=56519'
- name: Google Cloud CDN
  headers:
    # - 'Server: Google Frontend'
    - 'Server: Google Cloud CDN'
    - 'X-Google-Cache-Status'
    - 'Via: Google'
    - 'X-Edge-Location' # also an identifier of KeyCDN
  ranges:
    - range_type: 'combined'
      url: 'https://www.gstatic.com/ipranges/cloud.json'
    - range_type: 'combined'
      url: 'https://www.gstatic.com/ipranges/goog.json'
- name: Verizon EdgeCast # apparently shut down in 2025
  headers:
    - 'Server: ECS'
- name: Alibaba Cloud CDN
  headers:
    - 'Via: Alibaba Cloud CDN'
    - 'Ali-CDN-Cache'
    - 'X-Alibaba-Edge'
    - 'Server: Alibaba'
- name: CDN77
  headers:
    - 'Server: CDN77'
    - 'CDN77'
    - 'X-CDN: CDN77'
- name: OVH CDN
  headers:
    - 'Server: OVHcdn'
  ranges:
    - range_type: ipv4
      url: 'https://docs.ovhcloud.com/en/guides/network/content-delivery-network-infrastructure/cdn-infrastructure-ip-range'
      last_updated: 2026-06-05
- name: BelugaCDN
  headers:
    - 'X-Beluga-Cache'
    - 'Server: BelugaCDN'
- name: ChinaCache # seems to have been sold (website redirects)
  headers:
    - 'Server: ChinaCache'
- name: CDNetworks
  headers:
    - 'X-CDN: CDNetworks'
    - 'Server: CDNetworks'
- name: Medianova
  headers:
    - 'X-Medianova-Cache'
  ranges:
    - range_type: 'combined'
      url: 'https://cloud.medianova.com/api/v1/ip/addresses-txt'
- name: Azion
  headers:
    - 'X-Azion-Cache'
    - 'Server: AzionCDN'
- name: Netlify
  headers:
    - 'Server: Netlify'
    - 'X-NF-Cache-Status'
- name: Vercel
  headers:
    - 'Server: Vercel'
- name: RocketCDN
  headers:
    - 'X-Rocket-CDN'
    - 'Server: RocketCDN'
- name: Reblaze
  headers:
    - 'X-Reblaze-Cache'
    - 'Server: Reblaze'
- name: Express CDN # dont know if it exists.
  headers:
    - 'X-Express-CDN'
    - 'Express-CDN-Cache'
    - 'Express-CDN-Cache-Status'
    - 'Express-CDN-Cache-Control'
    - 'Express-CDN-Request-ID'
