name: Fetch ranges

on:
  schedule:
    # every monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ranges
  cancel-in-progress: true

jobs:
  fetch-and-write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run fetch script
        env:
          CLICKHOUSE_CDN_HOST: ${{ secrets.CLICKHOUSE_CDN_HOST }}
          CLICKHOUSE_CDN_PORT: ${{ secrets.CLICKHOUSE_CDN_PORT }}
          CLICKHOUSE_CDN_USER: ${{ secrets.CLICKHOUSE_CDN_USER }}
          CLICKHOUSE_CDN_PASSWORD: ${{ secrets.CLICKHOUSE_CDN_PASSWORD }}
          CLICKHOUSE_CDN_DATABASE: ${{ vars.CLICKHOUSE_CDN_DATABASE }}
          CLICKHOUSE_CDN_TABLE: ${{ vars.CLICKHOUSE_CDN_TABLE }}
          CLICKHOUSE_SECURE: ${{ vars.CLICKHOUSE_SECURE }}
          CLICKHOUSE_IPINFO_HOST: ${{ secrets.CLICKHOUSE_IPINFO_HOST }}
          CLICKHOUSE_IPINFO_PORT: ${{ secrets.CLICKHOUSE_IPINFO_PORT }}
          CLICKHOUSE_IPINFO_USER: ${{ secrets.CLICKHOUSE_IPINFO_USER }}
          CLICKHOUSE_IPINFO_PASSWORD: ${{ secrets.CLICKHOUSE_IPINFO_PASSWORD }}
          CLICKHOUSE_IPINFO_DATABASE: ${{ vars.CLICKHOUSE_IPINFO_DATABASE }}
          CLICKHOUSE_IPINFO_TABLE: ${{ vars.CLICKHOUSE_IPINFO_TABLE }}
        run: uv run ranges
