name: Monthly Release

on:
  schedule:
    - cron: "0 12 1 * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install uv dependencies
        run: uv sync --frozen --all-extras

      - name: Calculate version and date
        id: version
        run: |
          VERSION=$(TZ=Europe/Berlin date +%y.%m.0)
          DATE=$(TZ=Europe/Berlin date +%d.%m.%Y)
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION ($DATE)"

      - name: Update versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i -E "s/version = \"(.+)\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/\"version\": \"(.+)\"/\"version\": \"$VERSION\"/" package.json
          
          uv sync --all-extras

      - name: Commit version changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'release: v${{ steps.version.outputs.version }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.date }}" \
            --generate-notes \
            --notes "## Release for version 'v${{ steps.version.outputs.version }}' (${{ steps.version.outputs.date }})
          
          - PyPi: https://pypi.org/project/cdns/${{ steps.version.outputs.version }}/
          - NPM: https://www.npmjs.com/package/@ds-ukassel/cdns/v/${{ steps.version.outputs.version }}"
