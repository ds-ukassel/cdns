# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

services:

  ranges:
    image: registry.uni-kassel.dev/scraper/cdn_ranges
    build:
      dockerfile: ./python/ranges/Dockerfile
      platforms: [ linux/amd64, linux/arm64 ]
    depends_on:
      - clickhouse-cdns
    ipc: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - CLICKHOUSE_CDN_HOST=clickhouse-cdns
      - CLICKHOUSE_IPINFO_HOST=clickhouse-cdns

  clickhouse-cdns:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-cdns
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144


volumes:
  clickhouse_data:
