# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

services:
  clickhouse-cdns:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-cdns
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144


  minio:
    # The last good Minio version. Everything after this version removes the admin console.
    # See https://github.com/minio/minio/releases/tag/RELEASE.2025-05-24T17-08-30Z
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server --console-address ":9001" /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001" # Admin Console http://localhost:9101
    volumes:
      - minio_data:/data

volumes:
  clickhouse_data:
  minio_data:
