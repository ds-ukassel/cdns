[project]
name = "cdns"
version = "0.1.0"
description = "List of CDNs with identification and detection tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minioservice",
    "PyYAML~=6.0.0",
]


[project.scripts]
ranges = "ranges.main:main"


[tool.hatch.build.targets.wheel]
packages = ["src/ranges"]


[project.optional-dependencies]
ranges = [
    "requests~=2.34.2",
    "clickhouse-connect>=1.3.0",
    "beautifulsoup4>=4.15.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
test = [
    "pytest>=9.0.0",
]

lint = [
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "black>=26.5.1",
]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

# Temporary workaround until libs are published
[tool.uv.sources]
minioservice = { path = "libs/minioservice-0.1.0-py3-none-any.whl" }
