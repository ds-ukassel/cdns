[project]
name = "cdns"
version = "0.1.0"
description = "List of CDNs with identification and detection tools."
readme = "README.md"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.12"
keywords = ["cdn", "ip", "ranges", "detection", "identification"]
dependencies = [
  "PyYAML~=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["python/cdns"]

[tool.hatch.build.targets.sdist]
include = [
  "python/cdns",
  "README.md",
  "LICENSE*",
  "pyproject.toml",
  "dist/cdns.json",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
  "pytest>=9.0.0",
]

lint = [
  "ruff>=0.15.15",
  "ty>=0.0.40",
]

dev = [
  { include-group = "test" },
  { include-group = "lint" },

  # Ranges
  "requests~=2.34.2",
  "clickhouse-connect>=1.3.0",
  "beautifulsoup4>=4.15.0",

  "black>=26.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
